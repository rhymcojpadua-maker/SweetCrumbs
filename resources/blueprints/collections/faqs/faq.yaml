title: FAQ
tabs:
  main:
    display: Content
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Internal title
              required: true
          -
            handle: question
            field:
              type: text
              display: Question
              required: true
          -
            handle: answer
            field:
              type: textarea
              display: Answer
              required: true
          -
            handle: order
            field:
              type: integer
              display: Sort order
              default: 0
